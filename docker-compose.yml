# GastosE Docker Compose
# Development and production deployment

version: "3.8"

services:
  # PostgreSQL database
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: gastose-postgres
    environment:
      POSTGRES_DB: gastose
      POSTGRES_USER: gastose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastose_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastose -d gastose"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gastose-network

  # FastAPI backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastose-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://gastose:${POSTGRES_PASSWORD:-gastose_dev_password}@postgres:5432/gastose
      GASTOSE_DOCUMENT_STORAGE_PATH: /data/documents
      GASTOSE_SECRET_KEY: ${GASTOSE_SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - document_storage:/data/documents
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - gastose-network

  # Frontend (static files served by nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gastose-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gastose-network

volumes:
  postgres_data:
  document_storage:

networks:
  gastose-network:
    driver: bridge
