<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastosE - Gestión de Gastos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>GastosE</h1>
        <nav>
            <button id="login-btn">Login</button>
            <button id="logout-btn" style="display: none;">Logout</button>
        </nav>
    </header>

    <main>
        <!-- Login Form -->
        <section id="login-section">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <div id="login-error" class="error" style="display: none;"></div>
        </section>

        <!-- Main App (hidden until login) -->
        <section id="app-section" style="display: none;">
            <div class="tabs">
                <button class="tab active" data-tab="documents">Documentos</button>
                <button class="tab" data-tab="expenses">Gastos</button>
                <button class="tab" data-tab="suppliers">Proveedores</button>
            </div>

            <!-- Documents Tab -->
            <div id="documents-tab" class="tab-content">
                <h2>Documentos</h2>
                <div class="upload-area">
                    <h3>Subir Documento</h3>
                    <input type="file" id="file-input" accept=".pdf,.xml,.jpg,.jpeg,.png">
                    <button id="upload-btn">Subir</button>
                </div>
                <div id="documents-list">
                    <h3>Documentos Recientes</h3>
                    <ul id="documents-ul"></ul>
                </div>
            </div>

            <!-- Expenses Tab -->
            <div id="expenses-tab" class="tab-content" style="display: none;">
                <h2>Gastos</h2>
                <div id="expenses-list">
                    <h3>Gastos</h3>
                    <ul id="expenses-ul"></ul>
                </div>
            </div>

            <!-- Suppliers Tab -->
            <div id="suppliers-tab" class="tab-content" style="display: none;">
                <h2>Proveedores</h2>
                <div id="suppliers-list">
                    <h3>Proveedores</h3>
                    <ul id="suppliers-ul"></ul>
                </div>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
