openapi: 3.0.3
info:
  title: GastosE API
  description: >
    Contrato de API de GastosE (gestión de gastos, facturas recibidas,
    tickets y documentos asociados). Versionado en URL (/api/v1).
    Dinero como string decimal exacto (nunca float). Fechas ISO-8601.
    Errores en formato RFC 7807 (application/problem+json).
  version: 1.0.0
  contact:
    name: GastosE architecture
servers:
  - url: /api/v1
    description: Versión 1 del contrato
tags:
  - name: health
  - name: suppliers
  - name: documents
  - name: extractions
  - name: expenses
  - name: expense-lines
  - name: tax-lines
  - name: categories
  - name: payment-methods
  - name: payments
  - name: review
  - name: duplications
  - name: tax-rates
  - name: currencies
  - name: audit
paths:
  /healthz:
    get:
      tags: [health]
      summary: Comprobación de salud
      security: []
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /suppliers:
    get:
      tags: [suppliers]
      summary: Listar proveedores
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: q
          description: Búsqueda por NIF/CIF o nombre (FR-SUP-3)
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/SupplierStatus"
      responses:
        "200":
          description: Colección de proveedores
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Supplier"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [suppliers]
      summary: Registrar proveedor (FR-SUP-1)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierCreate"
      responses:
        "201":
          description: Proveedor creado
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /suppliers/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [suppliers]
      summary: Obtener proveedor
      responses:
        "200":
          description: Proveedor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [suppliers]
      summary: Actualizar proveedor (FR-SUP-2 valida NIF/CIF)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Proveedor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [suppliers]
      summary: Eliminar proveedor (bloqueado si tiene gastos aceptados, FR-SUP-4)
      responses:
        "204":
          description: Eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /suppliers/{id}/deactivate:
    post:
      tags: [suppliers]
      summary: Marcar proveedor como inactive (FR-SUP-4)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Proveedor inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /documents:
    post:
      tags: [documents]
      summary: Subir documento fuente (asíncrono; FR-DOC-1..5)
      description: >
        Sube un archivo (PDF, imagen, XML). Valida tamaño/formato, calcula
        fingerprint SHA-256, almacena de forma inmutable y encola la
        extracción. Devuelve 202 con Location. Si el fingerprint ya existe,
        se crea una duplicación probable (DUP-1).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                document_type:
                  description: Tipo declarado (se detecta el real por magic bytes, FR-DOC-5)
                  $ref: "#/components/schemas/DocumentType"
      responses:
        "202":
          description: Documento aceptado; extracción en curso
          headers:
            Location:
              description: URI para consultar el estado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Tamaño o páginas fuera de límites
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Formato no soportado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [documents]
      summary: Listar documentos fuente
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/DocumentState"
        - in: query
          name: document_type
          schema:
            $ref: "#/components/schemas/DocumentType"
      responses:
        "200":
          description: Colección de documentos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /documents/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [documents]
      summary: Obtener documento fuente y su estado (ciclo A)
      responses:
        "200":
          description: Documento fuente
          headers:
            ETag:
              description: ETag para caché de recurso inmutable
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    head:
      tags: [documents]
      summary: Metadatos del documento (ETag)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Metadatos
          headers:
            ETag:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{id}/verify-fingerprint:
    post:
      tags: [documents]
      summary: Verificar integridad por fingerprint bajo demanda (NFR-3)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Resultado de verificación
          content:
            application/json:
              schema:
                type: object
                properties:
                  fingerprint:
                    $ref: "#/components/schemas/Sha256"
                  matches:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{id}/content:
    get:
      tags: [documents]
      summary: Descargar el contenido del documento fuente
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Contenido binario del documento
          headers:
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{id}/extractions:
    get:
      tags: [extractions]
      summary: Listar extracciones de un documento
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Colección de extracciones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Extraction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{id}/extractions/retry:
    post:
      tags: [extractions]
      summary: Reintentar extracción (nueva extracción si el fallo es recuperable, FR-FST-2)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Nueva extracción encolada
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extraction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /extractions/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [extractions]
      summary: Obtener extracción con sus valores extraídos (E3)
      responses:
        "200":
          description: Extracción
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extraction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /expenses:
    get:
      tags: [expenses]
      summary: Listar gastos
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ExpenseState"
        - in: query
          name: supplier_id
          schema:
            type: string
            format: uuid
        - in: query
          name: category_id
          schema:
            type: string
            format: uuid
        - in: query
          name: currency
          schema:
            $ref: "#/components/schemas/CurrencyCode"
        - in: query
          name: date_from
          description: Fecha del documento desde (ISO-8601)
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          schema:
            type: string
            format: date
        - in: query
          name: sort
          description: Orden determinístico (p. e.g. -created_at, total)
          schema:
            type: string
      responses:
        "200":
          description: Colección de gastos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [expenses]
      summary: Crear gasto a partir de un documento fuente (FR-EXP-1)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "201":
          description: Gasto creado en estado draft
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /expenses/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [expenses]
      summary: Obtener gasto
      responses:
        "200":
          description: Gasto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [expenses]
      summary: Modificar gasto (solo en estado no terminal; auditado, FR-EXP-3)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Gasto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /expenses/{id}/accept:
    post:
      tags: [expenses]
      summary: Aceptar gasto (FR-ACC-1..4; IRREV)
      description: >
        Revalidación definitiva + comprobación de invariantes (INV-5, INV-6,
        INV-8) + transición a accepted + snapshot inmutable. Idempotente por
        diseño.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        "200":
          description: Gasto aceptado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
  /expenses/{id}/reject:
    post:
      tags: [expenses]
      summary: Rechazar gasto (FR-REJ-1..3; IRREV, motivo obligatorio)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Gasto rechazado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /expenses/{id}/void:
    post:
      tags: [expenses]
      summary: Anular gasto aceptado (FR-EXP-5; IRREV, motivo obligatorio)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Gasto anulado (el original conserva accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /expenses/{id}/submit-review:
    post:
      tags: [expenses]
      summary: Enviar gasto a revisión (draft -> under_review)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Gasto en revisión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /expenses/{id}/lines:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [expense-lines]
      summary: Listar líneas de gasto
      responses:
        "200":
          description: Colección de líneas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [expense-lines]
      summary: Añadir línea de gasto (FR-LIN-1)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseLineCreate"
      responses:
        "201":
          description: Línea creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /expenses/{id}/lines/{lineId}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - in: path
        name: lineId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [expense-lines]
      summary: Obtener línea de gasto
      responses:
        "200":
          description: Línea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [expense-lines]
      summary: Modificar línea de gasto
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - in: path
          name: lineId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseLineUpdate"
      responses:
        "200":
          description: Línea actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [expense-lines]
      summary: Eliminar línea de gasto
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - in: path
          name: lineId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /expenses/{id}/lines/{lineId}/tax-lines:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - in: path
        name: lineId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [tax-lines]
      summary: Listar líneas fiscales de una línea de gasto
      responses:
        "200":
          description: Colección de líneas fiscales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [tax-lines]
      summary: Añadir línea fiscal (FR-TAX-1)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - in: path
          name: lineId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxLineCreate"
      responses:
        "201":
          description: Línea fiscal creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /expenses/{id}/payments:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [payments]
      summary: Listar pagos de un gasto
      responses:
        "200":
          description: Colección de pagos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [payments]
      summary: Registrar pago de un gasto (FR-PAY-1)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
      responses:
        "201":
          description: Pago registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
