components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Token de sesión autenticado. Autenticación obligatoria en todos los
        endpoints (salvo /healthz). Autorización por rol (NFR-7): reader,
        reviewer, approver, admin.
  security:
    - bearerAuth: []
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      description: Identificador del recurso (UUIDv7)
      schema:
        type: string
        format: uuid
    Cursor:
      in: query
      name: cursor
      description: Cursor de paginación (opcional; del next_cursor de la página anterior)
      schema:
        type: string
    Limit:
      in: query
      name: limit
      description: Número de elementos por página (por defecto 50, máx. 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      description: >
        Clave de idempotencia. Repetir la misma key en una mutación devuelve
        la misma respuesta sin re-ejecutar (NFR-4).
      required: false
      schema:
        type: string
  responses:
    Unauthorized:
      description: No autenticado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: No autorizado (rol insuficiente)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso no existe (o no pertenece al usuario)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflicto (estado inválido, duplicado, transición no permitida)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Validación de negocio fallida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Locked:
      description: Recurso bloqueado (p. e.g. en revisión, duplicación probable)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: Error en formato RFC 7807 (application/problem+json)
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://gastos.example/errors/validation
        title:
          type: string
          example: Validation error
        status:
          type: integer
          example: 422
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: lines[1].total
              issue:
                type: string
                example: arithmetic_mismatch
    Page:
      type: object
      description: Envoltorio de paginación por cursor
      properties:
        items:
          type: array
        next_cursor:
          type: string
          nullable: true
          description: Cursor para la siguiente página (null si no hay más)
        limit:
          type: integer
    Sha256:
      type: string
      description: Fingerprint SHA-256 en hexadecimal
      pattern: "^[a-f0-9]{64}$"
      example: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
    Decimal:
      type: string
      description: >
        Importe monetario como decimal exacto (nunca float). Formato: número
        decimal con punto como separador (p. e.g. "1234.56"). Moneda ISO-4217
        obligatoria en el contexto.
      pattern: '^-?\d+(\.\d+)?$'
      example: "1234.56"
    CurrencyCode:
      type: string
      description: Código de moneda ISO-4217
      pattern: "^[A-Z]{3}$"
      example: EUR
    DocumentType:
      type: string
      enum: [received_invoice, ticket, other]
    DocumentFormat:
      type: string
      description: Formato detectado por magic bytes (no declarado)
      enum: [xml, pdf_text, pdf_scanned, image]
    DocumentState:
      type: string
      description: Estado del documento fuente (ciclo A)
      enum:
        - uploaded
        - processing
        - extracted
        - uncertain
        - validation_error
        - duplicate
        - manually_corrected
        - validated
        - accepted
        - rejected
        - confirmed_duplicate
        - failed
    ExtractionState:
      type: string
      description: Estado de la extracción (ciclo B)
      enum: [pending, running, completed, failed, reprocessed]
    ExtractionMethod:
      type: string
      description: Método de extracción usado (cascada determinística)
      enum: [xml_schema, pdf_text_rules, ocr, vision_llm]
    ExpenseState:
      type: string
      description: Estado del gasto (ciclo C)
      enum:
        - draft
        - under_review
        - validation_error
        - duplicate
        - ready_for_acceptance
        - accepted
        - voided
        - rejected
        - confirmed_duplicate
        - failed
    ReviewState:
      type: string
      description: Estado de la revisión (ciclo D)
      enum: [in_progress, completed, aborted]
    FieldReviewResult:
      type: string
      description: Resultado de revisión por campo
      enum: [confirmed, corrected, rejected]
    ValidationOutcome:
      type: string
      description: "Resultado de validación de un valor (06-validation-rules.md: passed, failed BLOCK, warning WARN)"
      enum: [passed, failed, warning, corrected]
    SupplierStatus:
      type: string
      enum: [active, inactive]
    ReferenceStatus:
      type: string
      enum: [active, inactive]
    TaxKind:
      type: string
      description: Tipo de impuesto
      enum: [vat, withholding]
    DuplicationState:
      type: string
      description: Estado de la duplicación
      enum: [probable, confirmed, resolved_not_duplicate]
    DuplicationType:
      type: string
      description: Tipo de duplicación
      enum: [fingerprint, logical]
    Provenance:
      type: object
      description: Proveniencia de un valor extraído (INV-11)
      required: [method]
      properties:
        method:
          $ref: "#/components/schemas/ExtractionMethod"
        page:
          type: integer
          nullable: true
        bbox:
          type: array
          nullable: true
          description: Coordenadas [x0, y0, x1, y1]
          items:
            type: number
        rule:
          type: string
          nullable: true
    ExtractedValue:
      type: object
      description: "Valor extraído (N2): no fiable, con confidence y provenance"
      required: [field, raw_value, confidence, provenance]
      properties:
        field:
          type: string
          description: Campo canónico (p. e.g. supplier.nif, invoice.number, total, line[0].amount)
          example: supplier.nif
        raw_value:
          type: string
          description: Valor crudo tal como se leyó
          example: "B12345678"
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.95
        provenance:
          $ref: "#/components/schemas/Provenance"
    Supplier:
      type: object
      required: [id, legal_name, tax_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        legal_name:
          type: string
        tax_id:
          type: string
          description: NIF/CIF con dígito de control validado
          example: B12345678
        fiscal_address:
          type: string
          nullable: true
        contact:
          type: object
          nullable: true
          additionalProperties:
            type: string
        status:
          $ref: "#/components/schemas/SupplierStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SupplierCreate:
      type: object
      required: [legal_name, tax_id]
      properties:
        legal_name:
          type: string
        tax_id:
          type: string
        fiscal_address:
          type: string
        contact:
          type: object
          additionalProperties:
            type: string
    SupplierUpdate:
      type: object
      properties:
        legal_name:
          type: string
        tax_id:
          type: string
        fiscal_address:
          type: string
        contact:
          type: object
